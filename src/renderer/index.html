<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.modrinth.com; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
  <title>ModLoom</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Icon-Sprite: eine Formsprache, gleiche Strichstärke überall. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-search"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></g>
      <g id="i-cube"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></g>
      <g id="i-list"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></g>
      <g id="i-spool"><path d="M6 4h12M6 20h12"/><path d="M8 4v16M16 4v16"/><path d="M8 9h8M8 13h8"/></g>
      <g id="i-gear"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/></g>
      <g id="i-download"><path d="M12 3v12"/><path d="m7 10.5 5 5 5-5"/><path d="M4 20h16"/></g>
      <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
      <g id="i-trash"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.2A1.8 1.8 0 0 0 9.2 21h5.6a1.8 1.8 0 0 0 1.8-1.8L17.5 7"/></g>
      <g id="i-check"><path d="m5 12.5 4.5 4.5L19 7"/></g>
      <g id="i-warn"><path d="M12 4.5 21 20H3l9-15.5Z"/><path d="M12 10v4.5M12 17.4v.2"/></g>
      <g id="i-external"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 19V7.8A1.8 1.8 0 0 1 5.8 6H10"/></g>
      <g id="i-folder"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4L11 8.5h8.5A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18V7.5Z"/></g>
      <g id="i-refresh"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></g>
      <g id="i-chevron"><path d="m9 5 7 7-7 7"/></g>
      <g id="i-close"><path d="M6 6 18 18M18 6 6 18"/></g>
      <g id="i-box"><path d="M4.5 8.5h15v10a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5v-10Z"/><path d="M3.5 4.5h17v4h-17z"/><path d="M10 12.5h4"/></g>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><use href="#i-spool"/></svg>
        </span>
        <span>
          <span class="t-head" style="display:block">ModLoom</span>
          <span class="t-cap dim-more" style="display:block;margin-top:-2px">Fabric &amp; Modrinth</span>
        </span>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot">
        <button class="setup-card" id="setup-card" type="button"></button>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar" id="toolbar"></header>
      <div class="scroll" id="scroll">
        <div class="view" id="view"></div>
      </div>
    </main>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <script src="spring.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
