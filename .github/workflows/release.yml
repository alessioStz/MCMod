name: Release bauen

# Ein Tag wie v1.0.1 genügt: GitHub baut die .exe-Dateien und hängt sie an ein Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Windows-Pakete bauen
        run: npx electron-builder --win --publish never

      - name: Als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: ModLoom-windows
          path: dist/*.exe

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dateien = Get-ChildItem dist/*.exe | ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" @dateien `
            --title "ModLoom $env:GITHUB_REF_NAME" `
            --generate-notes
