name: Release bauen

# Ein Tag wie v1.1.0 genügt: GitHub baut die .exe-Dateien, hängt sie an ein
# Release und legt latest.yml dazu — daran erkennt die App neue Fassungen.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Nur bauen (Lauf ohne Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --publish never

      - name: Bauen und Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      # electron-builder benennt das Release nur mit der nackten Versionsnummer.
      # electron-updater liest den Titel als releaseName aus, und in der
      # Release-Liste soll der Produktname stehen — also nachziehen.
      - name: Release benennen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $titel = "ModLoom $version"
          gh release edit $tag --title $titel
          $ist = gh release view $tag --json name --jq .name
          if ($ist -ne $titel) { throw "Titel ist '$ist', erwartet '$titel'" }
          Write-Host "Release heißt jetzt: $ist"

      - name: Ergebnis als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: ModLoom-windows
          path: |
            dist/*.exe
            dist/latest.yml
