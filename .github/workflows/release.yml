name: Release bauen

# Ein Tag wie v1.1.0 genügt: GitHub baut die .exe-Dateien, hängt sie an ein
# Release und legt latest.yml dazu — daran erkennt die App neue Fassungen.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Nur bauen (Lauf ohne Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --publish never

      - name: Bauen und Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Ergebnis als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: ModLoom-windows
          path: |
            dist/*.exe
            dist/latest.yml
